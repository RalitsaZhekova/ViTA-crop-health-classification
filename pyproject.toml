[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-crop-mvp"
version = "1.0.0"
description = "Two local crop-intelligence MVPs for Sentinel-2 and Balkan-1"
requires-python = ">=3.10,<3.14"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.115,<1",
  "matplotlib>=3.7,<4",
  "numpy>=1.26,<3",
  "omnicloudmask==1.7.1",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "rasterio>=1.3.10,<2",
  "scipy>=1.10,<2",
  "terratorch>=1.1.1,<1.3",
  "torch>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
vita-mvp = "vita_integration.cli:main"
vita-dashboard = "prithvi_ground.api:main"
vita-ingest = "vita_integration.ingest:main"
vita-payload-server = "prithvi_payload.service:main"

[tool.setuptools.packages.find]
where = ["payload/src", "shared/src", "ground/src", "integration/src"]

[tool.setuptools.package-data]
cloud_detection = ["configs/*.yaml"]
prithvi_ground = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
