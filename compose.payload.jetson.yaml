services:
  payload:
    image: ${VITA_PAYLOAD_IMAGE:-vita-payload:0.1.0}
    build:
      context: .
      dockerfile: deployment/payload/Dockerfile
      args:
        BASE_IMAGE: ${VITA_PAYLOAD_BASE_IMAGE:?Select a JetPack/L4T-compatible PyTorch base}
        APPLICATION_VERSION: "0.1.0"
        VCS_REF: ${VITA_GIT_COMMIT:-unknown}
        BUILD_DATE: ${VITA_BUILD_DATE:-unknown}
        APPLICATION_UID: ${VITA_CONTAINER_UID:-1000}
        APPLICATION_GID: ${VITA_CONTAINER_GID:-1000}
        VITA_TARGET_PLATFORM: jetson
    restart: unless-stopped
    runtime: nvidia
    command:
      - python
      - -m
      - prithvi_payload.service
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./runtime/payload/jobs:/data/jobs
      - ./runtime/payload/outbox:/data/outbox
      - ./runtime/payload/logs:/data/logs
    secrets:
      - earth_engine_credentials
    environment:
      EE_PROJECT_ID: ${EE_PROJECT_ID:?Set EE_PROJECT_ID in .env.payload}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/earth_engine_credentials
      CUDA_REQUIRED: "1"
      VITA_MAX_CONCURRENT_JOBS: "1"
      EE_MAX_CANDIDATES: ${EE_MAX_CANDIDATES:-50}
      EE_MAX_SCENE_ATTEMPTS: ${EE_MAX_SCENE_ATTEMPTS:-5}
      VITA_JOBS_DIR: /data/jobs
      VITA_OUTBOX_DIR: /data/outbox
      VITA_LOGS_DIR: /data/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          value=json.load(urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=5));
          assert value["status"] == "ok" and value["models_warmed"] and value["cuda_available"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 240s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  earth_engine_credentials:
    file: ${EE_CREDENTIALS_FILE:-./secrets/earth-engine.json}
