services:
  payload:
    image: ${VITA_PAYLOAD_IMAGE:-vita-payload:0.1.0-local}
    build:
      context: .
      dockerfile: deployment/payload/Dockerfile
      args:
        BASE_IMAGE: ${VITA_PAYLOAD_BASE_IMAGE:?Set VITA_PAYLOAD_BASE_IMAGE in .env.payload}
        APPLICATION_VERSION: "0.1.0"
        VCS_REF: ${VITA_GIT_COMMIT:-unknown}
        BUILD_DATE: ${VITA_BUILD_DATE:-unknown}
        APPLICATION_UID: ${VITA_CONTAINER_UID:-1000}
        APPLICATION_GID: ${VITA_CONTAINER_GID:-1000}
    restart: unless-stopped
    command: [python, -m, prithvi_payload.service, --host, 0.0.0.0, --port, "8081"]
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./runtime/payload/jobs:/data/jobs
      - ./runtime/payload/outbox:/data/outbox
      - ./runtime/payload/logs:/data/logs
    secrets:
      - earth_engine_credentials
    environment:
      EE_PROJECT_ID: ${EE_PROJECT_ID:?Set EE_PROJECT_ID in .env.payload}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/earth_engine_credentials
      CUDA_REQUIRED: ${CUDA_REQUIRED:-1}
      VITA_MAX_CONCURRENT_JOBS: ${VITA_MAX_CONCURRENT_JOBS:-1}
      EE_MAX_CANDIDATES: ${EE_MAX_CANDIDATES:-50}
      EE_MAX_SCENE_ATTEMPTS: ${EE_MAX_SCENE_ATTEMPTS:-5}
      VITA_JOBS_DIR: /data/jobs
      VITA_OUTBOX_DIR: /data/outbox
      VITA_LOGS_DIR: /data/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=5).read()']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 180s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ground:
    image: ${VITA_GROUND_IMAGE:-vita-ground:0.1.0}
    build:
      context: .
      dockerfile: deployment/ground/Dockerfile
      args:
        BASE_IMAGE: ${VITA_GROUND_BASE_IMAGE:-python:3.11-slim-bookworm}
        APPLICATION_VERSION: "0.1.0"
        VCS_REF: ${VITA_GIT_COMMIT:-unknown}
        BUILD_DATE: ${VITA_BUILD_DATE:-unknown}
        APPLICATION_UID: ${VITA_CONTAINER_UID:-1000}
        APPLICATION_GID: ${VITA_CONTAINER_GID:-1000}
    restart: unless-stopped
    command: [python, -m, prithvi_ground.api, --store, /data/ground, --host, 0.0.0.0, --port, "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime/ground:/data/ground
    environment:
      VITA_GROUND_STORE: /data/ground
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).read()']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

secrets:
  earth_engine_credentials:
    file: ${EE_CREDENTIALS_FILE:-./secrets/earth-engine.json}
