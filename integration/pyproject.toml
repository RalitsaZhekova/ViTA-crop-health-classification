[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-space-integration"
version = "0.3.0"
description = "Sentinel payload-to-ground MVP orchestration for ViTA crop intelligence"
requires-python = ">=3.10,<3.14"
dependencies = [
  "prithvi-crop-ground==0.3.0",
  "prithvi-crop-payload==0.3.0",
  "prithvi-crop-shared==0.1.0",
  "requests>=2.32,<3",
]

[project.scripts]
vita-sentinel-run = "vita_integration.pipeline:main"
vita-sentinel-mvp = "vita_integration.mvp:main"
vita-mission = "vita_integration.mission_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
