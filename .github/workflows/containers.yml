name: Container images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/containers.yml'
      - 'deploy/**'
      - 'ground/**'
      - 'integration/**'
      - 'payload/**'
      - 'shared/**'
      - 'pyproject.toml'

permissions:
  contents: read
  packages: write

jobs:
  ground:
    name: Ground image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.ground
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/vita-ground:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/vita-ground:latest
          cache-from: type=gha,scope=vita-ground
          cache-to: type=gha,mode=max,scope=vita-ground

  payload:
    name: Payload image (Jetson ARM64)
    # Register the Orin as a private Actions runner with all three labels.
    # Native Jetson builds avoid fragile QEMU emulation and validate the L4T base.
    runs-on: [self-hosted, Linux, ARM64, jetson]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build the Jetson image natively
        shell: bash
        run: |
          docker build \
            --file deploy/Dockerfile.payload \
            --build-arg VITA_PAYLOAD_BASE_IMAGE=nvcr.io/nvidia/pytorch:25.01-py3-igpu \
            --tag ghcr.io/${{ steps.image.outputs.owner }}/vita-payload:${{ github.sha }} \
            --tag ghcr.io/${{ steps.image.outputs.owner }}/vita-payload:latest \
            .
      - name: Confirm packaged stack imports
        shell: bash
        run: |
          docker run --rm --runtime nvidia \
            ghcr.io/${{ steps.image.outputs.owner }}/vita-payload:${{ github.sha }} \
            python -c 'import tensorrt, torch, torch_tensorrt; assert torch.cuda.is_available(); print(torch.__version__, tensorrt.__version__, torch_tensorrt.__version__)'
      - name: Publish payload image
        shell: bash
        run: |
          docker push ghcr.io/${{ steps.image.outputs.owner }}/vita-payload:${{ github.sha }}
          docker push ghcr.io/${{ steps.image.outputs.owner }}/vita-payload:latest

