seed_everything: 42

trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 50
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  enable_checkpointing: true
  default_root_dir: outputs/prithvi_4band_head_only
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: outputs/logs
      name: prithvi_4band_head_only
  callbacks:
    - class_path: lightning.pytorch.callbacks.RichProgressBar
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/prithvi_4band_head_only/checkpoints
        monitor: val/Macro_F1
        mode: max
        save_top_k: 2
        save_last: true
        filename: "epoch={epoch:02d}-macro_f1={val/Macro_F1:.4f}"
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/Macro_F1
        mode: max
        patience: 10

# Official TIFF order is BLUE,GREEN,RED,NIR_NARROW,SWIR_1,SWIR_2,
# repeated for each of 3 dates. TerraTorch selects only the four listed
# indices from every date and returns [C=4,T=3,H=224,W=224].
data:
  class_path: prithvi_crop.data.CropTypeDataModule
  init_args:
    data_root: data/multi_temporal_crop
    batch_size: 8
    num_workers: 4
    drop_last: true
    reduce_zero_label: true
    expand_temporal_dimension: true
    use_metadata: true
    validation_fraction: 0.1
    split_seed: 42
    bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
    train_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.HorizontalFlip
        init_args:
          p: 0.5
      - class_path: albumentations.VerticalFlip
        init_args:
          p: 0.5
      - class_path: albumentations.RandomRotate90
        init_args:
          p: 0.5
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 3
    val_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 3
    test_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 3

model:
  class_path: prithvi_crop.task.CropSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: prithvi_eo_v2_100_tl
      backbone_pretrained: true
      backbone_num_frames: 3
      backbone_coords_encoding:
        - time
        - location
      backbone_bands:
        - BLUE
        - GREEN
        - RED
        - NIR_NARROW
      rescale: true
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          effective_time_dim: 3
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.1
      num_classes: 13
    loss: ce
    ignore_index: -1
    class_names:
      - Natural Vegetation
      - Forest
      - Corn
      - Soybeans
      - Wetlands
      - Developed / Barren
      - Open Water
      - Winter Wheat
      - Alfalfa
      - Fallow / Idle Cropland
      - Cotton
      - Sorghum
      - Other
    class_weights:
      - 0.386375
      - 0.661126
      - 0.548184
      - 0.640482
      - 0.876862
      - 0.925186
      - 3.249462
      - 1.542289
      - 2.175141
      - 2.272419
      - 3.062762
      - 3.626097
      - 1.198702
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    plot_on_val: false
    evaluation_output_dir: outputs/prithvi_4band_head_only/evaluation

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0003
    weight_decay: 0.05

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 50
    eta_min: 0.000001
