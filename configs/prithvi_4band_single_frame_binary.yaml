seed_everything: 42

trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  max_epochs: 18
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  enable_checkpointing: true
  default_root_dir: outputs/prithvi_4band_single_frame_binary
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: outputs/logs
      name: prithvi_4band_single_frame_binary
  callbacks:
    - class_path: lightning.pytorch.callbacks.RichProgressBar
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/prithvi_4band_single_frame_binary/checkpoints
        monitor: val/Overall_Accuracy
        mode: max
        save_top_k: 3
        save_last: true
        filename: "epoch={epoch:02d}-binary_acc={val/Overall_Accuracy:.4f}"
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/Overall_Accuracy
        mode: max
        min_delta: 0.001
        patience: 5

data:
  class_path: prithvi_crop.data.CropTypeDataModule
  init_args:
    data_root: data/multi_temporal_crop
    batch_size: 32
    num_workers: 8
    drop_last: true
    reduce_zero_label: true
    expand_temporal_dimension: true
    use_metadata: true
    validation_fraction: 0.1
    split_seed: 42
    single_frame: true
    european_data_root: data/europe/pastis
    european_fraction: 0.2
    european_folds: [1, 2, 3, 4]
    bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
    train_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: prithvi_crop.transforms.RandomNonIdentityDihedral
        init_args:
          p: 1.0
      - class_path: albumentations.Affine
        init_args:
          scale: [0.96, 1.04]
          translate_percent: [-0.03, 0.03]
          rotate: [-6.0, 6.0]
          shear: [-2.0, 2.0]
          keep_ratio: true
          balanced_scale: true
          border_mode: 4
          p: 0.5
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 1
    val_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 1
    test_transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.pytorch.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 1

model:
  class_path: prithvi_crop.task.CropSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: prithvi_eo_v2_100_tl
      backbone_pretrained: true
      backbone_num_frames: 1
      backbone_coords_encoding:
        - time
        - location
      backbone_bands:
        - BLUE
        - GREEN
        - RED
        - NIR_NARROW
      rescale: true
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          effective_time_dim: 1
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.2
      num_classes: 2
    loss: ce
    ignore_index: -1
    class_names:
      - Non-crop
      - Crop
    class_weights: [1.0, 1.0]
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    plot_on_val: false
    binary_only: true
    crop_binary_loss_weight: 0.0
    initial_checkpoint: outputs/prithvi_4band_single_frame/checkpoints/epoch=23-deployment=0.6572.ckpt
    initial_checkpoint_adapter: fine_to_binary
    evaluation_output_dir: outputs/prithvi_4band_single_frame_binary/evaluation

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.00005
    weight_decay: 0.05

lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 18
    eta_min: 0.0000005
