[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prithvi-crop-ground"
version = "0.2.0"
description = "Ground-side storage, history, API and client application boundary"
requires-python = ">=3.10,<3.14"
dependencies = [
  "prithvi-crop-shared==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
