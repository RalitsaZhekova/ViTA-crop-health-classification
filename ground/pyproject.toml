[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prithvi-crop-ground"
version = "0.3.0"
description = "Ground-side storage, history, API and client application boundary"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "prithvi-crop-shared==0.1.0",
  "pillow>=10,<13",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
vita-ground-ingest = "prithvi_ground.catalog:main"
vita-ground-serve = "prithvi_ground.api:main"

[tool.setuptools.packages.find]
where = ["src"]
