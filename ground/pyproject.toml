[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prithvi-crop-ground"
version = "0.1.0"
description = "Ground-side crop-condition measurements and records"
requires-python = ">=3.10,<3.14"
dependencies = [
  "prithvi-crop-shared==0.1.0",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
