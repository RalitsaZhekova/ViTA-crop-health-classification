services:
  vita-payload:
    build:
      context: .
      dockerfile: deployment/payload/Dockerfile
      args:
        PAYLOAD_BASE_IMAGE: ${PAYLOAD_BASE_IMAGE:?Select a target-qualified x86 CUDA or Jetson/L4T base image}
    image: vita-payload:production
    restart: unless-stopped
    environment:
      EE_PROJECT_ID: vita-503208
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/earth_engine_credentials
      EE_MAX_CANDIDATES: "50"
      EE_MAX_SCENE_ATTEMPTS: "5"
      CUDA_REQUIRED: "1"
      PAYLOAD_QUEUE_SIZE: "8"
      VITA_JOB_ROOT: /data/jobs
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - payload_jobs:/data/jobs
    secrets:
      - earth_engine_credentials
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  payload_jobs:

secrets:
  earth_engine_credentials:
    file: /etc/vita/secrets/earth-engine.json
