[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prithvi-crop-payload"
version = "0.2.0"
description = "Crop inference and cloud detection for the Balkan-1 payload"
requires-python = ">=3.10,<3.14"
dependencies = [
  "prithvi-crop-shared==0.1.0",
  "numpy>=1.26,<3",
  "torch>=2.5,<3",
  "terratorch==1.2.10",
  "cloudsen12_models==1.0.2",
  "pyyaml>=6,<7",
  "rasterio>=1.3.10,<2",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
]

[project.scripts]
cloud-detect = "cloud_detection.cli:main"
scene-inspect = "prithvi_payload.scene_intake:main"
scene-plan-cloud = "prithvi_payload.cloud_stage:main"
scene-run = "prithvi_payload.pipeline:main"
payload-condition = "prithvi_payload.condition_stage:main"

[tool.setuptools.packages.find]
where = ["src"]
