model:
  backend: omnicloudmask
  name: omnicloudmask_v4
  package_version: 1.7.1
  model_version: 4.0
  model_input_order: [RED, GREEN, NIR]
  weights_folder: ../../models/omnicloudmask
  expected_sha256: ab8f039866d6714b249f850779b9523b5f6afb55ee891077a71db0fdebc9b529
  device: auto
  inference_dtype: fp32
  patch_size: 1000
  patch_overlap: 300
  batch_size: 1

input:
  processing_level: MULTISENSOR_REFLECTANCE
  supported_sensors: [sentinel-2, balkan-1]
  # Retained for the standalone four-band GeoTIFF command. The stage-gated
  # pipeline resolves equivalent sensor-specific logical bands at intake.
  band_names: [B08, B04, B03, B02]
  reflectance_scale: 10000.0
  clip_min: null
  clip_max: null
  nodata_value: 0
  strict_positive_rgn: true
  balkan_target_resolution_m: 10.0
  balkan_max_analysis_pixels: 25000000
  require_band_descriptions: false

# The supplied integration's frozen baseline uses 1000 px patches with 300 px
# overlap. Windowed execution keeps full-scene memory bounded.
tiling:
  size: 1000
  overlap: 300
  padding_mode: reflect

classes:
  clear: 0
  thick_cloud: 1
  thin_cloud: 2
  cloud_shadow: 3

postprocessing:
  include_shadow_as_unusable: true
  dilation_pixels: 2
  minimum_region_pixels: 16

# Decisions are based on all unusable pixels after post-processing, not only clouds.
decision:
  process_max_unusable_percentage: 30.0
  reject_min_unusable_percentage: 80.0

output:
  save_class_scores: true
  # The dashboard builds its own final preview from the scientific rasters.
  # Keep this off in production to avoid a redundant matplotlib render.
  save_preview: false
