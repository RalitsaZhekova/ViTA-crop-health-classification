model:
  backend: cloudsen12
  name: dtacs4bands
  package_version: 1.0.2
  weights_folder: ../../models/cloudsen12
  expected_sha256: 37205adce72fbbb65a3cfa8f47676c84ebf9b1555a27a3838d584072c954b22d
  device: auto

input:
  processing_level: L1C
  collection: COPERNICUS/S2_HARMONIZED
  band_names: [B08, B04, B03, B02]
  reflectance_scale: 10000.0
  clip_min: null
  clip_max: null
  nodata_value: 0
  require_band_descriptions: false

# Tiling is kept even though the upstream model can pad complete scenes. It limits
# peak memory onboard and makes partial-scene processing possible.
tiling:
  size: 512
  overlap: 64
  padding_mode: reflect

classes:
  clear: 0
  thick_cloud: 1
  thin_cloud: 2
  cloud_shadow: 3

postprocessing:
  include_shadow_as_unusable: true
  dilation_pixels: 2
  minimum_region_pixels: 16

# Decisions are based on all unusable pixels after post-processing, not only clouds.
decision:
  process_max_unusable_percentage: 30.0
  reject_min_unusable_percentage: 80.0

output:
  save_class_scores: true
  save_preview: true
