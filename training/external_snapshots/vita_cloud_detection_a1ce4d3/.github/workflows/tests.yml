name: cloud-detection-tests

on:
  push:
    paths:
      - "phase1/cloud_detection/**"
  pull_request:
    paths:
      - "phase1/cloud_detection/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase1/cloud_detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not integration"
