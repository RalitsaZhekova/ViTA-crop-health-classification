[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-cloud-detection"
version = "0.2.0"
description = "Sentinel-2 CloudSEN12 cloud detection for ViTA Space Challenges 2026"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
  "numpy>=1.24,<3",
  "rasterio>=1.3.9",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "psutil>=5.9"
]

[project.optional-dependencies]
model = [
  "torch>=2.0",
  "cloudsen12_models==1.0.2"
]
gee = [
  "earthengine-api>=1.2",
  "geemap>=0.33"
]
dev = [
  "pytest>=8",
  "pytest-cov>=5"
]
all = [
  "torch>=2.0",
  "cloudsen12_models==1.0.2",
  "earthengine-api>=1.2",
  "geemap>=0.33",
  "pytest>=8",
  "pytest-cov>=5"
]

[project.scripts]
cloud-detect = "cloud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the official pretrained model weights"]

[tool.coverage.run]
source = ["cloud_detection"]
