# lightning.pytorch==2.6.5
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 16-mixed
  logger:
    class_path: lightning.pytorch.loggers.TensorBoardLogger
    init_args:
      save_dir: outputs/logs
      name: prithvi_4band_europe_replay
      log_graph: false
      default_hp_metric: true
      prefix: ''
      comment: ''
      max_queue: 10
      flush_secs: 120
      filename_suffix: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.RichProgressBar
    init_args:
      refresh_rate: 100
      leave: false
      theme:
        description: ''
        progress_bar: '#6206E0'
        progress_bar_finished: '#6206E0'
        progress_bar_pulse: '#6206E0'
        batch_progress: ''
        time: dim
        processing_speed: dim underline
        metrics: italic
        metrics_text_delimiter: ' '
        metrics_format: .3f
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: epoch
      log_momentum: false
      log_weight_decay: false
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: outputs/prithvi_4band_europe_replay/checkpoints
      filename: epoch={epoch:02d}-macro_f1={val/Macro_F1:.4f}
      monitor: val/Macro_F1
      verbose: false
      save_last: true
      save_top_k: 2
      save_on_exception: false
      save_weights_only: false
      mode: max
      auto_insert_metric_name: false
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/Macro_F1
      min_delta: 0.0005
      patience: 4
      verbose: false
      mode: max
      strict: true
      check_finite: true
      log_rank_zero_only: false
  fast_dev_run: false
  max_epochs: 12
  max_steps: -1
  overfit_batches: 0.0
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  enable_checkpointing: true
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  inference_mode: true
  use_distributed_sampler: true
  detect_anomaly: false
  barebones: false
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: outputs/prithvi_4band_europe_replay
  enable_autolog_hparams: true
model:
  class_path: prithvi_crop.task.CropSegmentationTask
  init_args:
    model_args:
      backbone: prithvi_eo_v2_100_tl
      backbone_pretrained: true
      backbone_num_frames: 3
      backbone_coords_encoding:
      - time
      - location
      backbone_bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
      rescale: true
      necks:
      - name: SelectIndices
        indices:
        - 2
        - 5
        - 8
        - 11
      - name: ReshapeTokensToImage
        effective_time_dim: 3
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.2
      num_classes: 13
    model_factory: EncoderDecoderFactory
    loss: ce
    class_weights:
    - 0.386375
    - 0.661126
    - 0.548184
    - 0.640482
    - 0.876862
    - 0.925186
    - 3.249462
    - 1.542289
    - 2.175141
    - 2.272419
    - 3.062762
    - 3.626097
    - 1.198702
    ignore_index: -1
    lr: 0.001
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    plot_on_val: false
    class_names:
    - Natural Vegetation
    - Forest
    - Corn
    - Soybeans
    - Wetlands
    - Developed / Barren
    - Open Water
    - Winter Wheat
    - Alfalfa
    - Fallow / Idle Cropland
    - Cotton
    - Sorghum
    - Other
    output_on_inference: prediction
    output_most_probable: true
    tiled_inference_on_testing: false
    tiled_inference_on_validation: false
    evaluation_output_dir: outputs/prithvi_4band_europe_replay/evaluation
    initial_checkpoint: outputs/prithvi_4band_augmented_refine/checkpoints/epoch=06-macro_f1=0.5051.ckpt
    crop_binary_loss_weight: 0.25
data:
  class_path: prithvi_crop.data.CropTypeDataModule
  init_args:
    data_root: data/multi_temporal_crop
    batch_size: 8
    num_workers: 6
    bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    train_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: prithvi_crop.transforms.RandomNonIdentityDihedral
      init_args:
        p: 1.0
    - class_path: albumentations.Affine
      init_args:
        scale:
        - 0.96
        - 1.04
        translate_percent:
        - -0.03
        - 0.03
        rotate:
        - -6.0
        - 6.0
        shear:
        - -2.0
        - 2.0
        keep_ratio: true
        balanced_scale: true
        border_mode: 4
        p: 0.5
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        transpose_mask: false
        p: 1.0
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    val_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        transpose_mask: false
        p: 1.0
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    test_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        transpose_mask: false
        p: 1.0
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    drop_last: true
    no_data_replace: 0.0
    no_label_replace: -1
    expand_temporal_dimension: true
    reduce_zero_label: true
    use_metadata: true
    metadata_file_name: chips_df.csv
    validation_fraction: 0.1
    split_seed: 42
    european_data_root: data/europe/pastis
    european_fraction: 0.2
    european_folds:
    - 1
    - 2
    - 3
    - 4
out_dtype: int16
deploy_config_file: true
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5.0e-06
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.1
    amsgrad: false
    maximize: false
    capturable: false
    differentiable: false
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 12
    eta_min: 5.0e-07
    last_epoch: -1
