data:
  class_path: prithvi_crop.data.CropTypeDataModule
  init_args:
    bands:
    - BLUE
    - GREEN
    - RED
    - NIR_NARROW
    batch_size: 8
    data_root: data/multi_temporal_crop
    drop_last: true
    european_data_root: data/europe/pastis
    european_folds:
    - 1
    - 2
    - 3
    - 4
    european_fraction: 0.2
    expand_temporal_dimension: true
    metadata_file_name: chips_df.csv
    no_data_replace: 0.0
    no_label_replace: -1
    num_workers: 4
    reduce_zero_label: true
    split_seed: 42
    test_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    train_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: prithvi_crop.transforms.RandomNonIdentityDihedral
      init_args:
        p: 1.0
    - class_path: albumentations.Affine
      init_args:
        balanced_scale: true
        border_mode: 4
        keep_ratio: true
        p: 0.5
        rotate:
        - -6.0
        - 6.0
        scale:
        - 0.96
        - 1.04
        shear:
        - -2.0
        - 2.0
        translate_percent:
        - -0.03
        - 0.03
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    use_metadata: true
    val_transform:
    - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
    - class_path: albumentations.pytorch.ToTensorV2
      init_args:
        p: 1.0
        transpose_mask: false
    - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
      init_args:
        n_timesteps: 3
    validation_fraction: 0.1
deploy_config_file: true
model:
  class_path: prithvi_crop.task.CropSegmentationTask
  init_args:
    class_names:
    - Natural Vegetation
    - Forest
    - Corn
    - Soybeans
    - Wetlands
    - Developed / Barren
    - Open Water
    - Winter Wheat
    - Alfalfa
    - Fallow / Idle Cropland
    - Cotton
    - Sorghum
    - Other
    class_weights:
    - 0.386375
    - 0.661126
    - 0.548184
    - 0.640482
    - 0.876862
    - 0.925186
    - 3.249462
    - 1.542289
    - 2.175141
    - 2.272419
    - 3.062762
    - 3.626097
    - 1.198702
    crop_binary_loss_weight: 0.25
    evaluation_output_dir: outputs/prithvi_4band_europe_replay/evaluation
    freeze_backbone: true
    freeze_decoder: false
    freeze_head: false
    ignore_index: -1
    initial_checkpoint: outputs/prithvi_4band_augmented_refine/checkpoints/epoch=06-macro_f1=0.5051.ckpt
    loss: ce
    lr: 0.001
    model_args:
      backbone: prithvi_eo_v2_100_tl
      backbone_bands:
      - BLUE
      - GREEN
      - RED
      - NIR_NARROW
      backbone_coords_encoding:
      - time
      - location
      backbone_num_frames: 3
      backbone_pretrained: false
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.2
      necks:
      - indices:
        - 2
        - 5
        - 8
        - 11
        name: SelectIndices
      - effective_time_dim: 3
        name: ReshapeTokensToImage
      num_classes: 13
      rescale: true
    model_factory: EncoderDecoderFactory
    output_most_probable: true
    output_on_inference: prediction
    plot_on_val: false
    tiled_inference_on_testing: false
    tiled_inference_on_validation: false
out_dtype: int16
seed_everything: 42
trainer:
  accelerator: gpu
  accumulate_grad_batches: 1
  barebones: false
  check_val_every_n_epoch: 1
  detect_anomaly: false
  devices: 1
  enable_autolog_hparams: true
  enable_checkpointing: true
  fast_dev_run: false
  gradient_clip_val: 1.0
  inference_mode: true
  log_every_n_steps: 20
  logger: false
  max_epochs: 12
  max_steps: -1
  num_nodes: 1
  overfit_batches: 0.0
  precision: 16-mixed
  reload_dataloaders_every_n_epochs: 0
  strategy: auto
  sync_batchnorm: false
  use_distributed_sampler: true
