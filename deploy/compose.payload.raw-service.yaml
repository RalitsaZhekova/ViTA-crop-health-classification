name: vita-payload-raw-service

services:
  raw-payload:
    image: ${VITA_RAW_PAYLOAD_IMAGE:-vita-payload:raw-band}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.payload-overlay
      args:
        VITA_PAYLOAD_OVERLAY_BASE_IMAGE: ${VITA_RAW_PAYLOAD_BASE_IMAGE:-vita-payload:1.0.0}
        VITA_PAYLOAD_UID: ${VITA_RAW_HOST_UID:?set VITA_RAW_HOST_UID}
        VITA_PAYLOAD_GID: ${VITA_RAW_HOST_GID:?set VITA_RAW_HOST_GID}
    runtime: nvidia
    user: "${VITA_RAW_HOST_UID}:${VITA_RAW_HOST_GID}"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${VITA_RAW_PAYLOAD_PORT:-8091}:8091"
    environment:
      CUDA_REQUIRED: "1"
      TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "0"
      HOME: /runtime/home
      XDG_CACHE_HOME: /runtime/home/.cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VITA_INPUT_ROOT: /data
      VITA_PROCESSED_INPUT_ROOT: /operational-data
      VITA_OUTPUT_ROOT: /runtime/runs
      PRITHVI_MODEL_DIR: /models
      OMNICLOUDMASK_MODEL_DIR: /models/omnicloudmask
      VITA_MODEL_CACHE_DIR: /engine-cache/torch-export
      VITA_TRT_CACHE_DIR: /engine-cache/tensorrt
      VITA_TRT_MANIFEST: /engine-cache/tensorrt/direct/accepted.json
      VITA_CROP_BACKEND: tensorrt
      VITA_CROP_BATCH_SIZE: ${VITA_CROP_BATCH_SIZE:-16}
      VITA_CROP_TRT_PRECISION: ${VITA_CROP_TRT_PRECISION:-mixed-fp16}
      VITA_CLOUD_BACKEND: tensorrt
      VITA_CLOUD_INFERENCE_DTYPE: ${VITA_CLOUD_INFERENCE_DTYPE:-fp16}
      VITA_CLOUD_TRT_PRECISION: ${VITA_CLOUD_TRT_PRECISION:-fp16}
      VITA_CLOUD_SENTINEL_TRT_PRECISION: ${VITA_CLOUD_SENTINEL_TRT_PRECISION:-fp32}
      VITA_CLOUD_BATCH_SIZE: "1"
      VITA_RAW_CLOUD_FIXED_PATCH_SIZE: "1000"
      VITA_CPU_THREADS: ${VITA_RAW_CPU_THREADS:-8}
      VITA_RAW_PROXY_BAND_WORKERS: ${VITA_RAW_PROXY_BAND_WORKERS:-4}
      VITA_CONDITION_TILE_SIZE: ${VITA_CONDITION_TILE_SIZE:-4096}
      VITA_CONDITION_METRIC_THREADS: ${VITA_RAW_CPU_THREADS:-8}
      VITA_CONDITION_EXACT_PERCENTILES: "1"
      VITA_CROP_IN_MEMORY: "1"
      VITA_CROP_IN_MEMORY_MAX_BYTES: ${VITA_CROP_IN_MEMORY_MAX_BYTES:-1073741824}
      VITA_DOWNLINK_GRID_IN_MEMORY: "1"
      VITA_DOWNLINK_GRID_IN_MEMORY_MAX_BYTES: ${VITA_DOWNLINK_GRID_IN_MEMORY_MAX_BYTES:-536870912}
      VITA_DOWNLINK_GRID_THREADS: ${VITA_RAW_CPU_THREADS:-8}
      VITA_FAST_INTERMEDIATE_RASTERS: "1"
      VITA_COMPACT_PAYLOAD_PIPELINE: "1"
      VITA_WEBP_METHOD: "0"
      VITA_PNG_COMPRESSION_LEVEL: "1"
      OMP_NUM_THREADS: ${VITA_RAW_CPU_THREADS:-8}
      OPENBLAS_NUM_THREADS: ${VITA_RAW_CPU_THREADS:-8}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ${VITA_RAW_DATA_HOST:?set VITA_RAW_DATA_HOST}:/data:ro
      - ${VITA_PROCESSED_DATA_HOST:?set VITA_PROCESSED_DATA_HOST}:/operational-data:ro
      - ${VITA_RAW_MODEL_ASSETS_HOST:?set VITA_RAW_MODEL_ASSETS_HOST}:/models:ro
      - ${VITA_RAW_OUTPUT_HOST:?set VITA_RAW_OUTPUT_HOST}:/runtime
      - ${VITA_RAW_ENGINE_CACHE_HOST:?set VITA_RAW_ENGINE_CACHE_HOST}:/engine-cache:ro
    tmpfs:
      - /tmp:size=2g,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; value=json.load(urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=5)); assert value['status']=='ready'"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 120s
    command:
      - python
      - -m
      - prithvi_payload.raw_service
      - --host
      - 0.0.0.0
      - --port
      - "8091"
