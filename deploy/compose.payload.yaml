name: vita-payload

services:
  payload:
    image: ${VITA_PAYLOAD_IMAGE:-vita-payload:1.0.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.payload
      args:
        VITA_PAYLOAD_BASE_IMAGE: ${VITA_PAYLOAD_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.01-py3-igpu}
        VITA_PAYLOAD_UID: ${VITA_PAYLOAD_UID:-2002}
        VITA_PAYLOAD_GID: ${VITA_PAYLOAD_GID:-2002}
    runtime: nvidia
    user: "${VITA_PAYLOAD_UID:-2002}:${VITA_PAYLOAD_GID:-2002}"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    ports:
      - "127.0.0.1:${VITA_PAYLOAD_PORT:-8090}:8090"
    environment:
      CUDA_REQUIRED: "1"
      # The NGC base sets this to 1; disable its TF32 override so the accepted
      # native-CUDA Prithvi path retains the exported FP32 numerical contract.
      TORCH_ALLOW_TF32_CUBLAS_OVERRIDE: "0"
      HOME: /home/vita
      LOGNAME: vita-payload
      USER: vita-payload
      XDG_CACHE_HOME: /home/vita/.cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VITA_INPUT_ROOT: /data
      VITA_OUTPUT_ROOT: /runtime/runs
      VITA_BALKAN_ANALYSIS_CACHE_DIR: /runtime/cache/balkan-analysis
      VITA_BALKAN_PREPARE_INPUTS: ${VITA_BALKAN_PREPARE_INPUTS:-balkan1/preprocessed/3370_L1ORT.tif,balkan1/preprocessed/3408_L1ORT.tif}
      VITA_BALKAN_OVERVIEW_FAST_PATH: ${VITA_BALKAN_OVERVIEW_FAST_PATH:-1}
      VITA_BALKAN_OVERVIEW_REQUIRED: ${VITA_BALKAN_OVERVIEW_REQUIRED:-1}
      VITA_BALKAN_PREP_MAX_BYTES: ${VITA_BALKAN_PREP_MAX_BYTES:-2147483648}
      VITA_WEBP_METHOD: ${VITA_WEBP_METHOD:-0}
      VITA_PNG_COMPRESSION_LEVEL: ${VITA_PNG_COMPRESSION_LEVEL:-1}
      PRITHVI_MODEL_DIR: /models
      OMNICLOUDMASK_MODEL_DIR: /models/omnicloudmask
      VITA_MODEL_CACHE_DIR: /engine-cache/torch-export
      VITA_TRT_CACHE_DIR: /engine-cache/tensorrt
      # TensorRT 10.8 failed the fixed Prithvi decision-parity gate on this
      # Jetson stack. Keep the exact exported model on native CUDA in production.
      VITA_CROP_BACKEND: ${VITA_CROP_BACKEND:-pytorch}
      VITA_CROP_BATCH_SIZE: ${VITA_CROP_BATCH_SIZE:-16}
      VITA_TRT_CUDAGRAPHS: ${VITA_TRT_CUDAGRAPHS:-1}
      VITA_CLOUD_BACKEND: ${VITA_CLOUD_BACKEND:-tensorrt}
      VITA_CLOUD_TRT_REQUIRE_FULL: ${VITA_CLOUD_TRT_REQUIRE_FULL:-1}
      VITA_CLOUD_TRT_OPTIMIZATION_LEVEL: ${VITA_CLOUD_TRT_OPTIMIZATION_LEVEL:-5}
      VITA_CLOUD_TRT_NUM_AVG_TIMING_ITERS: ${VITA_CLOUD_TRT_NUM_AVG_TIMING_ITERS:-3}
      VITA_CLOUD_TRT_MAX_CLASS_MISMATCH: ${VITA_CLOUD_TRT_MAX_CLASS_MISMATCH:-0.001}
      VITA_CLOUD_TRT_VALIDATE_WARMUP_CALLS: ${VITA_CLOUD_TRT_VALIDATE_WARMUP_CALLS:-1}
      VITA_CLOUD_INFERENCE_DTYPE: ${VITA_CLOUD_INFERENCE_DTYPE:-fp16}
      VITA_CLOUD_BATCH_SIZE: ${VITA_CLOUD_BATCH_SIZE:-4}
      VITA_CLOUD_WARMUP_PATCH_SIZES: ${VITA_CLOUD_WARMUP_PATCH_SIZES:-869}
      VITA_DEMO_SENTINEL_IMAGES: ${VITA_DEMO_SENTINEL_IMAGES:-sentinel2/S2_20260610T091331_T35TLG_bulgaria-thrace.tif,sentinel2/S2_20260115T135659_T21LXF_brazil-mato-grosso.tif}
      VITA_WARMUP: ${VITA_WARMUP:-1}
      VITA_CPU_THREADS: ${VITA_CPU_THREADS:-8}
      VITA_CONDITION_TILE_SIZE: ${VITA_CONDITION_TILE_SIZE:-4096}
      VITA_CONDITION_METRIC_THREADS: ${VITA_CONDITION_METRIC_THREADS:-4}
      VITA_CONDITION_EXACT_PERCENTILES: ${VITA_CONDITION_EXACT_PERCENTILES:-1}
      VITA_CROP_IN_MEMORY: ${VITA_CROP_IN_MEMORY:-1}
      VITA_CROP_IN_MEMORY_MAX_BYTES: ${VITA_CROP_IN_MEMORY_MAX_BYTES:-1073741824}
      VITA_DOWNLINK_GRID_IN_MEMORY: ${VITA_DOWNLINK_GRID_IN_MEMORY:-1}
      VITA_DOWNLINK_GRID_IN_MEMORY_MAX_BYTES: ${VITA_DOWNLINK_GRID_IN_MEMORY_MAX_BYTES:-536870912}
      VITA_FAST_INTERMEDIATE_RASTERS: ${VITA_FAST_INTERMEDIATE_RASTERS:-1}
      VITA_COMPACT_PAYLOAD_PIPELINE: ${VITA_COMPACT_PAYLOAD_PIPELINE:-1}
      VITA_PERFORMANCE_REPETITIONS: ${VITA_PERFORMANCE_REPETITIONS:-3}
      OMP_NUM_THREADS: ${VITA_CPU_THREADS:-8}
      OPENBLAS_NUM_THREADS: ${VITA_CPU_THREADS:-8}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ../data:/data:ro
      - ../payload/models:/models:ro
      - ../runtime/payload:/runtime:Z
      - ../runtime/engines:/engine-cache:Z
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /home/vita:size=512m,uid=${VITA_PAYLOAD_UID:-2002},gid=${VITA_PAYLOAD_GID:-2002},mode=0700
