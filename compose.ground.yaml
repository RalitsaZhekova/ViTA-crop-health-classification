services:
  ground:
    image: ${VITA_GROUND_IMAGE:-vita-ground:0.1.0}
    build:
      context: .
      dockerfile: deployment/ground/Dockerfile
      args:
        BASE_IMAGE: ${VITA_GROUND_BASE_IMAGE:-python:3.11-slim-bookworm}
        APPLICATION_VERSION: "0.1.0"
        VCS_REF: ${VITA_GIT_COMMIT:-unknown}
        BUILD_DATE: ${VITA_BUILD_DATE:-unknown}
        APPLICATION_UID: ${VITA_CONTAINER_UID:-1000}
        APPLICATION_GID: ${VITA_CONTAINER_GID:-1000}
    restart: unless-stopped
    command:
      - python
      - -m
      - prithvi_ground.api
      - --store
      - /data/ground
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./runtime/ground:/data/ground
    environment:
      VITA_GROUND_STORE: /data/ground
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).read()
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
